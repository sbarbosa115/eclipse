# Services are autowired from src/; only what a type-hint cannot say is written here.
parameters:
  # The public address of the site: links in e-mails.
  app.url: '%env(APP_URL)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # A write use case's handler is registered on the command bus by implementing the marker: the Application layer
  # never names Messenger (deptrac.yaml).
  _instanceof:
    App\Shared\Application\Command\CommandHandler:
      tags: [{name: messenger.message_handler, bus: command.bus}]
    # Handled after the command that published them has committed (App\Shared\Application\Event\EventBus).
    App\Shared\Application\Event\EventHandler:
      tags: [{name: messenger.message_handler, bus: command.bus}]

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Kernel.php'
      # Data, not services: domain models and API DTOs.
      - '../src/*/Domain/Model/'
      - '../src/*/UI/Http/Output/'
      - '../src/*/UI/Http/Input/'
      # Needs NelmioApiDocBundle, which only dev and test install: registered below for those.
      - '../src/Shared/UI/Http/OpenApi/'

  # What a new company needs from each context, run inside the sign-up transaction, highest priority first: the
  # numbering series, the chart, the taxes and payment methods that point at its accounts, then the exógena concepts.
  # A new CompanyProvisioner gets its tag here (CompanyProvisionerOrderTest fails until it does).
  App\Company\Application\ProvisionNumberingSeries:
    tags: [{name: app.company_provisioner, priority: 200}]
  App\Ledger\Application\Seed\ProvisionLedger:
    tags: [{name: app.company_provisioner, priority: 100}]
  App\Ledger\Application\Provisioning\CatalogProvisioner:
    tags: [{name: app.company_provisioner, priority: 50}]
  App\Ledger\Application\Exogena\ProvisionExogenaConcepts:
    tags: [{name: app.company_provisioner, priority: 40}]

  App\Company\Application\CompanyRegistration:
    arguments:
      $provisioners: !tagged_iterator
        tag: app.company_provisioner

  App\Company\Application\Numbering\SalesInvoiceNumbering: '@App\Company\Application\Numbering\ResolutionSalesInvoiceNumbering'

  # Documents' emit and void handlers post through it; public so the ledger's tests reach the real one.
  App\Ledger\Application\Posting\JournalPoster:
    alias: App\Ledger\Application\Posting\LedgerJournalPoster
    public: true

# The #[ApiResponse] → OpenAPI describer: dev and test only, like NelmioApiDocBundle itself.
when@dev:
  services:
    App\Shared\UI\Http\OpenApi\ApiResponseDescriber:
      tags: [{name: nelmio_api_doc.route_describer, priority: -300}]

when@test:
  services:
    App\Shared\UI\Http\OpenApi\ApiResponseDescriber:
      tags: [{name: nelmio_api_doc.route_describer, priority: -300}]
