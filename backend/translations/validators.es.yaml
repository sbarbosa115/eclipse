# The API's own validation messages, in Spanish (the validator's built-in ones come translated by Symfony).
'This e-mail is already registered.': 'Este correo ya está registrado.'
'A company with this identification is already registered.': 'Ya hay una empresa registrada con este NIT.'
'Write the NIT with digits only, without the verification digit.': 'Escribe el NIT solo con números, sin el dígito de verificación.'
'The password must have at least {{ limit }} characters.': 'La contraseña debe tener al menos {{ limit }} caracteres.'
'This value should be of type %type%.': 'Este valor debe ser de tipo %type%.'
'This kind of tax does not belong to this class.': 'Este tipo de impuesto no corresponde a esta clase.'
'Choose a class of tax.': 'Elige la clase de impuesto.'
'Choose a kind of tax.': 'Elige el tipo de impuesto.'
'Choose how the tax is calculated.': 'Elige cómo se calcula el impuesto.'
'Only impoconsumo may be a value per unit.': 'Solo el impoconsumo puede ser un valor por unidad.'
'The value must be zero or more, with at most four decimals.': 'El valor debe ser cero o más, con máximo cuatro decimales.'
'The rate must be between 0 and 100, with at most four decimals.': 'La tarifa debe estar entre 0 y 100, con máximo cuatro decimales.'
'A tax of kind "none" has no rate.': 'Un impuesto de tipo "ninguno" no tiene tarifa.'
'The end date cannot be before the start date.': 'La fecha final no puede ser anterior a la inicial.'
'There is already a tax with this name.': 'Ya hay un impuesto con este nombre.'
'This account does not exist.': 'Esta cuenta no existe.'
'Choose a sub-account or an auxiliary account that is active.': 'Elige una subcuenta o un auxiliar que esté activo.'
'There is already a payment method with this name.': 'Ya hay una forma de pago con este nombre.'
'Choose cash or credit.': 'Elige contado o crédito.'
'A cash method needs the account its money lands in.': 'Una forma de pago de contado necesita la cuenta donde entra el dinero.'
"A credit method has no account: it posts to the tercero's account.": 'Una forma de pago a crédito no tiene cuenta: contabiliza en la cuenta del tercero.'
'A tercero with this identification already exists.': 'Ya existe un tercero con esta identificación.'
'The verification digit is a single digit.': 'El dígito de verificación es un solo dígito.'
'A NIT has only digits.': 'Un NIT solo tiene dígitos.'
'Write the identification with letters and digits only.': 'Escribe la identificación solo con letras y números.'
'The branch code is a number.': 'El código de sucursal es un número.'
'Write the razón social.': 'Escribe la razón social.'
'Write the name.': 'Escribe el nombre.'
'Choose a valid role.': 'Elige un rol válido.'
'Choose at least one role.': 'Elige al menos un rol.'
'Choose an account of the chart.': 'Elige una cuenta del plan de cuentas.'
'Choose an account that accepts postings.': 'Elige una cuenta que acepte movimientos.'
'Choose an account of the right group.': 'Elige una cuenta del grupo que corresponde.'
'A product or service with this code already exists.': 'Ya hay un producto o servicio con este código.'
'A category with this name already exists.': 'Ya hay una categoría con este nombre.'
'This category does not exist.': 'Esta categoría no existe.'
'Choose an active charge tax (IVA, impoconsumo).': 'Elige un impuesto cargo activo (IVA, impoconsumo).'
'Choose an active withholding tax (retención).': 'Elige un impuesto de retención activo.'
'Choose a postable account of the chart.': 'Elige una cuenta del plan de cuentas que reciba movimientos.'
'The price is lower than the tax per unit it includes.': 'El precio es menor que el impuesto por unidad que incluye.'
'Write the price in pesos, with at most four decimals.': 'Escribe el precio en pesos, con máximo cuatro decimales.'

# Company: profile, invoicing resolution, numbering
'Choose a document type.': 'Elige el tipo de documento.'
'Numbers go from 1 to 999999999.': 'Los números van de 1 a 999999999.'
'The prefix has up to ten letters and digits.': 'El prefijo tiene hasta diez letras y números.'
'Write the resolution number.': 'Escribe el número de resolución.'
'Numbers start at 1.': 'Los números empiezan en 1.'
'Hasta cannot be lower than desde.': 'El número final no puede ser menor que el inicial.'
'Manual invoicing needs the owner to confirm the DIAN permission first.': 'La facturación manual necesita que el propietario confirme primero el permiso de la DIAN.'
'Desde cannot change once invoices were numbered from this resolution.': 'El número inicial no se puede cambiar una vez que hay facturas numeradas con esta resolución.'
'The prefix cannot change once invoices were numbered from this resolution.': 'El prefijo no se puede cambiar una vez que hay facturas numeradas con esta resolución.'
'Hasta cannot be below the last number already used ({{ number }}).': 'El número final no puede ser menor que el último número usado ({{ number }}).'
'The next number cannot be lower than the current one.': 'El próximo número no puede ser menor que el actual.'
