# The API's own validation messages, in Spanish (the validator's built-in ones come translated by Symfony).
'This e-mail is already registered.': 'Este correo ya está registrado.'
'A company with this identification is already registered.': 'Ya hay una empresa registrada con este NIT.'
'Write the NIT with digits only, without the verification digit.': 'Escribe el NIT solo con números, sin el dígito de verificación.'
'The password must have at least {{ limit }} characters.': 'La contraseña debe tener al menos {{ limit }} caracteres.'
'This value should be of type %type%.': 'Este valor debe ser de tipo %type%.'
'A tercero with this identification already exists.': 'Ya existe un tercero con esta identificación.'
'The verification digit is a single digit.': 'El dígito de verificación es un solo dígito.'
'A NIT has only digits.': 'Un NIT solo tiene dígitos.'
'Write the identification with letters and digits only.': 'Escribe la identificación solo con letras y números.'
'The branch code is a number.': 'El código de sucursal es un número.'
'Write the razón social.': 'Escribe la razón social.'
'Write the name.': 'Escribe el nombre.'
'Choose a valid role.': 'Elige un rol válido.'
'Choose at least one role.': 'Elige al menos un rol.'
'Choose an account of the chart.': 'Elige una cuenta del plan de cuentas.'
'Choose an account that accepts postings.': 'Elige una cuenta que acepte movimientos.'
'Choose an account of the right group.': 'Elige una cuenta del grupo que corresponde.'
