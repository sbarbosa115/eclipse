# The API's own validation messages, in Spanish (the validator's built-in ones come translated by Symfony).
'This e-mail is already registered.': 'Este correo ya está registrado.'
'A company with this identification is already registered.': 'Ya hay una empresa registrada con este NIT.'
'Write the NIT with digits only, without the verification digit.': 'Escribe el NIT solo con números, sin el dígito de verificación.'
'The password must have at least {{ limit }} characters.': 'La contraseña debe tener al menos {{ limit }} caracteres.'
'This value should be of type %type%.': 'Este valor debe ser de tipo %type%.'
'A product or service with this code already exists.': 'Ya hay un producto o servicio con este código.'
'A category with this name already exists.': 'Ya hay una categoría con este nombre.'
'This category does not exist.': 'Esta categoría no existe.'
'Choose an active charge tax (IVA, impoconsumo).': 'Elige un impuesto cargo activo (IVA, impoconsumo).'
'Choose an active withholding tax (retención).': 'Elige un impuesto de retención activo.'
'Choose a postable account of the chart.': 'Elige una cuenta del plan de cuentas que reciba movimientos.'
'The price is lower than the tax per unit it includes.': 'El precio es menor que el impuesto por unidad que incluye.'
'Write the price in pesos, with at most four decimals.': 'Escribe el precio en pesos, con máximo cuatro decimales.'
