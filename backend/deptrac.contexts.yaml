# Bounded contexts: a context uses another only through its public face, its Application layer (commands, queries,
# ports, read DTOs) and its domain events. Its Domain model, Infrastructure and UI are its own business.
#
# Each context is two layers here: <Context> (Domain except Domain\Event, Infrastructure, UI) and <Context>Api
# (Application and Domain\Event). Shared is the shared kernel: everyone may use it, it uses nobody.
#
# To add a context, add both layers and give the rule lists that need it its <Context>Api.
deptrac:
  paths:
    - ./src

  layers:
    - name: Shared
      collectors:
        - {type: classNameRegex, value: '#^App\\Shared\\#'}
    - name: Access
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Access\\(Domain\\(?!Event\\)|Infrastructure\\|UI\\)#',
          }
    - name: AccessApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Access\\(Application|Domain\\Event)\\#',
          }
    - name: Company
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Company\\(Domain\\(?!Event\\)|Infrastructure\\|UI\\)#',
          }
    - name: CompanyApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Company\\(Application|Domain\\Event)\\#',
          }
    - name: Ledger
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Ledger\\(Domain\\(?!Event\\)|Infrastructure\\|UI\\)#',
          }
    - name: LedgerApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Ledger\\(Application|Domain\\Event)\\#',
          }
    - name: Party
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Party\\(Domain\\(?!Event\\)|Infrastructure\\|UI\\)#',
          }
    - name: PartyApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Party\\(Application|Domain\\Event)\\#',
          }
    - name: Catalog
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Catalog\\(Domain\\(?!Event\\)|Infrastructure\\|UI\\)#',
          }
    - name: CatalogApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Catalog\\(Application|Domain\\Event)\\#',
          }
    - name: Sales
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Sales\\(Domain\\(?!Event\\)|Infrastructure\\|UI\\)#',
          }
    - name: SalesApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Sales\\(Application|Domain\\Event)\\#',
          }
    - name: Purchasing
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Purchasing\\(Domain\\(?!Event\\)|Infrastructure\\|UI\\)#',
          }
    - name: PurchasingApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Purchasing\\(Application|Domain\\Event)\\#',
          }
    - name: Reporting
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Reporting\\(Domain\\(?!Event\\)|Infrastructure\\|UI\\)#',
          }
    - name: ReportingApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Reporting\\(Application|Domain\\Event)\\#',
          }

  ruleset:
    Shared: ~
    # Signing up creates the company (Company) and the session shows its name.
    Access: [Shared, AccessApi, CompanyApi]
    AccessApi: [Shared, Access, CompanyApi]
    Company: [Shared, CompanyApi]
    CompanyApi: [Shared, Company]
    # Journal entries are numbered by the company's series (Company numbering).
    Ledger: [Shared, LedgerApi, CompanyApi]
    LedgerApi: [Shared, Ledger, CompanyApi]
    # A tercero's own receivable/payable account must be a postable account of the chart (Ledger).
    Party: [Shared, PartyApi, LedgerApi]
    PartyApi: [Shared, Party, LedgerApi]
    # A product's default taxes and accounts come from the ledger's catalogs.
    Catalog: [Shared, CatalogApi, LedgerApi]
    CatalogApi: [Shared, Catalog, LedgerApi]
    # Documents are numbered (Company), copy terceros (Party), products (Catalog) and taxes, and post (Ledger).
    Sales: [Shared, SalesApi, CompanyApi, LedgerApi, PartyApi, CatalogApi]
    SalesApi: [Shared, Sales, CompanyApi, LedgerApi, PartyApi, CatalogApi]
    # The mirror of Sales.
    Purchasing:
      [Shared, PurchasingApi, CompanyApi, LedgerApi, PartyApi, CatalogApi]
    PurchasingApi:
      [Shared, Purchasing, CompanyApi, LedgerApi, PartyApi, CatalogApi]
    # The read side: cartera and reports read every document context and the ledger.
    Reporting:
      [
        Shared,
        ReportingApi,
        SalesApi,
        PurchasingApi,
        PartyApi,
        LedgerApi,
        CompanyApi,
      ]
    ReportingApi:
      [
        Shared,
        Reporting,
        SalesApi,
        PurchasingApi,
        PartyApi,
        LedgerApi,
        CompanyApi,
      ]
