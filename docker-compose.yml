# Host ports come from the environment or a root .env (gitignored), with the usual defaults, so a second checkout
# (a git worktree for a feature) can run its own stack next to this one: compose names containers and volumes after
# the folder.
x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  volumes:
    - ./backend:/app
    - uploads:/var/uploads
  environment:
    UPLOADS_DIR: /var/uploads
    # Links in e-mails point at this stack's own port.
    APP_URL: http://localhost:${HTTP_PORT:-8090}
  depends_on:
    database:
      condition: service_healthy

services:
  php:
    <<: *php

  # Sends the e-mails: drains the Messenger "async" queue (a table in the database), as the cron line does on cPanel.
  # Run "messenger:stop-workers" after changing PHP code; it restarts itself.
  worker:
    <<: *php
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-v"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # MariaDB, because production (cPanel) is MariaDB.
  database:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
    ports:
      - "${DB_PORT:-3316}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Lets the app user create app_test for the test suite.
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Builds the React UI (backend/assets → backend/public/build) and rebuilds on change.
  node:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/app
    environment:
      HOME: /tmp
    command: sh -c "npm install && npm run watch"

  # Catches every outgoing e-mail locally. Web inbox: http://localhost:8035 (or MAILPIT_PORT)
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_PORT:-8035}:8025"

  # The smoke suite (backend/e2e, Playwright). Not started with the stack: `docker compose --profile e2e run --rm e2e`.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["e2e"]
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    volumes:
      - ./backend:/app
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://nginx
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      - nginx
      - mailpit
    command: npx playwright test

volumes:
  db_data:
  uploads:
